<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Private, thoughtful conversations on Manglik Meets.">
    <title>Manglik Meets - Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="verification.css">
    <link rel="stylesheet" href="messages.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-config.js"></script>
    <script src="auth-session.js"></script>
    <script src="supabase-services.js"></script>
    <script src="auth-guard.js"></script>
    <script src="verification.js"></script>
    <script src="notification-badges.js"></script>
    <script src="navigation.js"></script>
    <link rel="stylesheet" href="chatbot.css">
  </head>
  <body>
    <div data-verification-slot hidden></div>
    <div class="dashboard-shell">
      <aside class="sidebar" id="messages-sidebar" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="Manglik Meets home"><span class="brand-mark" aria-hidden="true"><span class="m-large">M</span><span class="m-small">M</span></span><span>Manglik Meets</span></a>
        <nav class="sidebar-nav">
          <a class="nav-item" href="index.html"><span>⌂</span>Home</a>
          <a class="nav-item" href="discover.html"><span>◎</span>Discover</a>
          <a class="nav-item" href="feed.html"><span>◫</span>Community</a>
          <a class="nav-item" href="matches.html"><span>♡</span>Matches</a>
          <a class="nav-item active" href="messages.html"><span>◒</span>Messages</a>
          <a class="nav-item" href="notifications.html"><span>♧</span>Notifications <b class="nav-count rose" data-notification-badge>5</b></a>
          <button class="nav-item" type="button" data-future-action="saved"><span>⌑</span>Saved</button>
          <a class="nav-item" href="dashboard.html"><span>◉</span>Profile</a>
          <a class="nav-item" href="settings.html"><span>⚙</span>Settings</a>
        </nav>
        <button class="logout-button" type="button" data-future-action="logout"><span>↪</span>Log out</button>
      </aside>

      <div class="content-shell">
        <header class="topbar messages-topbar"><button class="mobile-menu-button" id="messages-mobile-menu" type="button" aria-controls="messages-sidebar" aria-expanded="false">☰</button><div class="messages-top-title"><p class="eyebrow">Private conversations</p><strong>Messages</strong></div><div class="topbar-actions"><a class="icon-button" href="notifications.html" aria-label="Notifications">♧<i class="alert-dot" data-notification-dot></i></a><a class="top-avatar" href="dashboard.html" aria-label="Open profile">AS</a></div></header>

        <main class="messages-main" data-component="messages-page">
          <section class="messenger-shell">
            <aside class="chat-list-panel" aria-label="Conversations">
              <div class="chat-list-head"><div><p class="eyebrow">Your conversations</p><h1>Chats</h1></div><button class="new-chat-button" type="button" data-future-action="new-chat" aria-label="New chat">＋</button></div>
              <label class="chat-search" for="chat-search-input"><span>⌕</span><input id="chat-search-input" type="search" placeholder="Search chats" autocomplete="off"></label>
              <div class="chat-filters" role="tablist" aria-label="Conversation filters"><button class="chat-filter active" type="button" data-chat-filter="recent" role="tab" aria-selected="true">Recent</button><button class="chat-filter" type="button" data-chat-filter="unread" role="tab" aria-selected="false">Unread <span id="unread-count">0</span></button><button class="chat-filter" type="button" data-chat-filter="favorites" role="tab" aria-selected="false">Favorites</button></div>
              <div class="chat-list" id="chat-list" data-supabase-table="conversations" aria-live="polite"></div>
              <div class="chat-list-empty" id="chat-list-empty" hidden><span>◌</span><p>No conversations found.</p></div>
            </aside>

            <section class="chat-main-panel" aria-label="Conversation">
              <header class="chat-header" id="chat-header"></header>
              <div class="message-search-bar" id="message-search-bar" hidden><label for="message-search-input">⌕ <input id="message-search-input" type="search" placeholder="Search in this conversation"></label><button id="close-message-search" type="button" aria-label="Close message search">×</button></div>
              <div class="message-thread" id="message-thread" data-supabase-table="messages" aria-live="polite"></div>
              <div class="image-preview" id="image-preview" hidden><img id="image-preview-image" alt="Selected image preview"><button id="remove-image-preview" type="button" aria-label="Remove image">×</button></div>
              <form class="message-composer" id="message-composer" data-supabase-action="insert-message">
                <input id="image-upload-input" type="file" accept="image/*" hidden>
                <button class="composer-icon" id="attachment-button" type="button" aria-label="Add attachment" title="Add attachment">📎</button>
                <div class="emoji-picker-wrap">
                  <button class="composer-icon" id="emoji-toggle" type="button" aria-label="Choose emoji" title="Choose emoji">😊</button>
                  <div class="emoji-picker" id="emoji-picker" hidden>
                    <button type="button">✨</button><button type="button">😊</button><button type="button">🙏</button>
                    <button type="button">🌷</button><button type="button">💛</button><button type="button">☕</button>
                    <button type="button">❤️</button><button type="button">👍</button><button type="button">🎉</button>
                  </div>
                </div>
                <textarea id="message-input" rows="1" maxlength="1000" placeholder="Type a message..."></textarea>
                <button class="send-button" type="submit" aria-label="Send message">➤</button>
              </form>
            </section>

            <aside class="conversation-details" id="conversation-details" aria-label="Conversation details"></aside>
          </section>
        </main>
      </div>
    </div>
    <div class="message-action-menu" id="message-action-menu" hidden></div>
    <div class="messages-toast" id="messages-toast" role="status" aria-live="polite"></div>
    <script src="messages.js"></script>
    <script src="supabase-integration.js"></script>
      <script src="chatbot.js"></script>
  </body>
</html>
